services:
  api:
    build:
      context: .
    container_name: seo-rag-api
    env_file:
      - .env
    environment:
      # Map user-friendly names to app's expected env vars
      OLLAMA_BASE_URL: ${QWEN_BASE_URL}
      OLLAMA_MODEL: ${QWEN_MODEL_NAME}
      OLLAMA_EMBED_MODEL: ${QWEN_EMBED_MODEL}

      # Qdrant URL used by app
      QDRANT_URL: http://${QDRANT_HOST}:${QDRANT_PORT}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE}

      FIRECRAWL_BASE_URL: ${FIRECRAWL_BASE_URL}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}

      LOG_LEVEL: ${LOG_LEVEL}
      BANNED_AI_PHRASES: ${BANNED_AI_PHRASES}

      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      UVICORN_WORKERS: ${UVICORN_WORKERS}
      UVICORN_TIMEOUT_KEEP_ALIVE: ${UVICORN_TIMEOUT_KEEP_ALIVE}

      # TODO(DevOps): replace local Ollama host with a dedicated inference host/service.
      # TODO(DevOps): use secret manager for FIRECRAWL_API_KEY / QDRANT_API_KEY.
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${APP_PORT:-8000}/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    # Local dev convenience: mount only app code (optional)
    volumes:
      - ./app:/app/app:ro

  qdrant:
    image: qdrant/qdrant:v1.11.5
    container_name: seo-rag-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      # TODO(DevOps): use managed storage / proper PVC in Kubernetes
      - qdrant_data:/qdrant/storage
    # Note: the upstream Qdrant image doesn't include curl/wget by default, so a
    # HTTP healthcheck would fail even when Qdrant is healthy. We rely on the
    # API container's `/readyz` endpoint instead.
    restart: unless-stopped

  # --- Placeholders for future services ---
  # ingestion:
  #   # TODO: split ingestion into a dedicated service if you expect large crawls.
  #   build: .
  #   command: ["python", "-m", "app.services.crawl_ingestion"]
  #   depends_on:
  #     - qdrant
  #
  # redis:
  #   # TODO(DevOps): add Redis when background jobs/workers are introduced.
  #   image: redis:7-alpine
  #
  # worker:
  #   # TODO: add a worker service for background jobs (RQ/Celery/Arq) later.
  #   build: .
  #   depends_on:
  #     - redis

volumes:
  qdrant_data:
